<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crossword widget harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* fake "website" background so the widget has something to sit on */
      .fake-site {
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 20% -10%, #ede9ff, transparent),
          radial-gradient(1000px 500px at 110% 10%, #e3f0ff, transparent), #0f1020;
        color: #fff;
        padding: 60px;
        box-sizing: border-box;
      }
      .fake-site h1 {
        font-size: 64px;
        letter-spacing: -2px;
        max-width: 720px;
      }
      .fake-site p {
        font-size: 22px;
        opacity: 0.7;
        max-width: 620px;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }
      .chip {
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 18px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="fake-site">
      <h1>Acme Analytics — see everything, ship faster.</h1>
      <p>The product analytics platform for modern teams. Track, understand, and act on user behavior in real time.</p>
      <div class="chips">
        <div class="chip">Dashboards</div>
        <div class="chip">Funnels</div>
        <div class="chip">Retention</div>
      </div>
    </div>

    <script src="./crossword-widget.js"></script>
    <script>
      const SCRIPT = {
        title: "CometChat Concierge",
        agentName: "Aster",
        welcome: "Welcome to CometChat. I'm Aster. How can I assist you today?",
        messages: [
          { role: "visitor", text: "Do you support real-time funnel analytics?" },
          {
            role: "ai",
            text: "Yes — funnels update live as events stream in, so you can watch drop-off in real time.",
          },
          { role: "visitor", text: "Can I get a demo?" },
          {
            role: "ai",
            text: "Absolutely! I can book you a 15-min walkthrough. What's your work email?",
          },
        ],
        startDelayMs: 600,
        endHoldMs: 1500,
      };

      (async () => {
        const css = await fetch("./crossword-widget.css").then((r) => r.text());
        CrosswordWidget.mount(SCRIPT, css);
      })();
    </script>
  </body>
</html>
